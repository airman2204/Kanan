  <rect x="10.5" y="7.5" width="3" height="3.5" fill="#1E3A5F" />
  <rect x="14.3" y="7.5" width="3.8" height="3.5" fill="#1E3A5F" />
  <!-- Cuerpo central y greca inferior -->
  <rect x="13" y="12.5" width="4.5" height="6" fill="none" stroke="#1E3A5F" stroke-width="1.6" />
  <polygon points="13,20 17.5,20 19,25.5 13,25.5" fill="none" stroke="#1E3A5F" stroke-width="1.6" />
  <path d="M12.5 27 H19.5 V29 H12.5 Z" fill="#2B7BB9" />
  <!-- Brazo diagonal K (Cerúleo y Cian) -->
