  <circle cx="6.5" cy="5.5" r="2.2" fill="none" stroke="#00B4D8" stroke-width="1.5" />
  <circle cx="8" cy="10.2" r="1.9" fill="none" stroke="#00B4D8" stroke-width="1.5" />
  <circle cx="9.2" cy="14.2" r="1.5" fill="none" stroke="#00B4D8" stroke-width="1.4" />
  <!-- Columna escalonada izquierda -->
  <path d="M9.5 16.5 H11.5 V28.5 H9.5 M9.5 18.5 H8 M9.5 21 H8 M9.5 23.5 H8 M9.5 26 H8 M9.5 28.5 H8" stroke="#1E3A5F" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <!-- Bloque trapezoidal superior (Armadura de bioseguridad) -->
